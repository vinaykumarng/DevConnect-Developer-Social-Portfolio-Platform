services:
  db:
    image: postgres:16
    container_name: devconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devconnect
      POSTGRES_PASSWORD: devconnect_local
      POSTGRES_DB: devconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: